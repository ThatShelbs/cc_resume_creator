name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_no_personal_data.py
      - run: python scripts/check_no_personal_data.py --history

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Prebuilt web app must be up to date
        run: test -z "$(git status --porcelain dist)" || (git status --porcelain dist; echo "Run npm run build and commit webapp/frontend/dist"; exit 1)
