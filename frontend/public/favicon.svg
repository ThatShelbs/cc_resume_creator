<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Resume Taylor mark: a tailor's dress form with a tape measure, a strand
       of friendship-bracelet beads, and a sequin sparkle. Source of truth for
       every raster (scripts/make_brand_assets.py). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343C5B"/>
      <stop offset="1" stop-color="#843745"/>
    </linearGradient>
    <linearGradient id="form" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBD3E3"/>
      <stop offset="1" stop-color="#F8BDD5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- stand -->
  <g stroke="#CEB499" stroke-linecap="round" fill="none">
    <path d="M32 42v10" stroke-width="2.4"/>
    <path d="M32 52l-6.5 4.2M32 52l6.5 4.2M32 52v4.6" stroke-width="2.2"/>
  </g>

  <!-- neck cap -->
  <circle cx="32" cy="9.6" r="1.7" fill="#CEB499"/>
  <rect x="28.6" y="10.6" width="6.8" height="4.4" rx="1.6" fill="#CEB499"/>

  <!-- torso -->
  <path fill="url(#form)" d="M22 16.2C26 14.6 29 14.1 32 14.1s6 .5 10 2.1c3.5 1.5 4.5 4 3.5 7-1 3.5-4.5 5.4-5 7.9-.5 2.5 3 5 3.5 9 0 1.5-1 2.4-3 2.4H23c-2 0-3-.9-3-2.4.5-4 4-6.5 3.5-9-.5-2.5-4-4.4-5-7.9-1-3 0-5.5 3.5-7z"/>
  <!-- princess seam -->
  <path d="M32 16.5v24.5" stroke="#843745" stroke-width=".9" stroke-dasharray="1.4 1.3" opacity=".45" fill="none"/>

  <!-- tape measure draped at the neck -->
  <g fill="none" stroke-linecap="round">
    <path d="M29.4 14.9c-2.4 2.2-3.6 5.4-4 9.8M34.6 14.9c2.4 2.2 3.4 4.8 3.8 7.8" stroke="#F6CC8F" stroke-width="2.4"/>
    <path d="M29.4 14.9c-2.4 2.2-3.6 5.4-4 9.8M34.6 14.9c2.4 2.2 3.4 4.8 3.8 7.8" stroke="#343C5B" stroke-width="1" stroke-dasharray=".5 1.5" opacity=".55"/>
  </g>

  <!-- bracelet beads at the waist -->
  <path d="M23.4 30.6c5.6 2.1 11.6 2.1 17.2 0" stroke="#343C5B" stroke-width=".7" fill="none" opacity=".6"/>
  <g stroke="#343C5B" stroke-width=".55">
    <circle cx="24.6" cy="31" r="1.75" fill="#BDD6B9"/>
    <circle cx="28" cy="31.9" r="1.75" fill="#F6CC8F"/>
    <circle cx="31.5" cy="32.2" r="1.75" fill="#D0B3D1"/>
    <circle cx="35" cy="31.9" r="1.75" fill="#C2E8F6"/>
    <circle cx="38.4" cy="31.1" r="1.75" fill="#843745"/>
  </g>

  <!-- sequin sparkles -->
  <path d="M50 8.5l1.35 3.9 3.9 1.35-3.9 1.35L50 19l-1.35-3.9-3.9-1.35 3.9-1.35z" fill="#F6CC8F"/>
  <path d="M12.5 40l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#C2E8F6"/>
</svg>
